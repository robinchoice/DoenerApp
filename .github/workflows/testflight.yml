name: TestFlight

# Baut die iOS-App in der Cloud und lädt sie zu TestFlight hoch.
# Grund: Apple verlangt Xcode 26 / iOS-26-SDK; lokaler Intel-Mac kann das nicht.
# doener-app ist public -> macOS-Runner-Minuten sind kostenlos.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iOS/**'
      - 'Shared/**'
      - '.github/workflows/testflight.yml'

jobs:
  build-upload:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Verfügbare Xcode-Versionen + neuestes wählen
        run: |
          ls -d /Applications/Xcode_*.app 2>/dev/null || true
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Wähle: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt generieren
        working-directory: iOS
        run: xcodegen generate

      - name: ASC-API-Key ablegen
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_KEY_P8 }}" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Archive bauen
        working-directory: iOS
        run: |
          xcodebuild archive \
            -project DoenerApp.xcodeproj \
            -scheme DoenerApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/DoenerApp.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}

      - name: Export & Upload zu TestFlight
        working-directory: iOS
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DoenerApp.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}
